[workspace]
name = "ekf_mono_slam"
version = "0.1.0"
description = "Visual Mono SLAM with 1-Point RANSAC EKF"
authors = ["Alvaro J. Gaona <alvgaona@gmail.com>"]
channels = [
  "https://prefix.dev/robostack-humble",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]

[dependencies]
ros-humble-ekf-mono-slam = { path = "ekf-mono-slam" }
ros-humble-ros2cli = "*"
ros-humble-ros2launch = "*"
ros-humble-ros2run = "*"
ros-humble-ros2pkg = "*"
clang-format = ">=18.1.3,<18.2"

[tasks]
app = "ros2 launch ekf_mono_slam vslam.launch.py"
# Fixtures under $CONDA_PREFIX/share/ekf_mono_slam/test/resources
test = "sh -c 'cd \"$CONDA_PREFIX/share/ekf_mono_slam\" && exec \"$CONDA_PREFIX/lib/ekf_mono_slam/slam_test\" \"$@\"' --"
